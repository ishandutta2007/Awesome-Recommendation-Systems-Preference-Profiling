<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0a0d18; border-radius:14px; overflow:hidden; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* CSS Keyframe Animations */
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1.5deg); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-1deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes barRise {
      0%, 100% { height: 28px; y: 252px; }
      50% { height: 60px; y: 220px; }
    }

    .pulse-bg { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .float1 { animation: floatPill1 5s ease-in-out infinite; }
    .float2 { animation: floatPill2 6s ease-in-out infinite; }
    .dash-line { stroke-dasharray: 8 6; animation: dashMove 14s linear infinite; }
    .radar { transform-origin: 1040px 180px; animation: radarSweep 12s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGlow)" />

  <!-- Ambient Glowing Orbs (in Background) -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.08" class="pulse-bg" />
  <circle cx="1060" cy="190" r="180" fill="#818cf8" opacity="0.10" class="pulse-bg" />
  <circle cx="600" cy="320" r="160" fill="#c084fc" opacity="0.07" class="pulse-bg" />

  <!-- Background Grid Pattern -->
  <g opacity="0.12" stroke="#64748b" stroke-width="0.8">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="660" y1="0" x2="660" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="1020" y1="0" x2="1020" y2="360" />
  </g>

  <!-- Neural Recommender Flow Web (in Background Right) -->
  <g opacity="0.35">
    <path d="M 880 180 C 940 120, 980 140, 1040 180 S 1100 240, 1160 180" fill="none" stroke="#38bdf8" stroke-width="1.5" class="dash-line" />
    <path d="M 880 130 C 950 200, 1000 100, 1070 170 S 1110 260, 1160 210" fill="none" stroke="#c084fc" stroke-width="1.5" class="dash-line" />
    
    <!-- User Preference Vector Nodes -->
    <circle cx="890" cy="180" r="5" fill="#38bdf8" />
    <circle cx="970" cy="140" r="4" fill="#818cf8" />
    <circle cx="1040" cy="180" r="7" fill="#c084fc" />
    <circle cx="1110" cy="220" r="5" fill="#38bdf8" />
    <circle cx="1160" cy="180" r="6" fill="#ec4899" />

    <!-- Animated Radar Circle -->
    <circle cx="1040" cy="180" r="70" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3" />
    <circle cx="1040" cy="180" r="110" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.2" />
    <line x1="1040" y1="180" x2="1140" y2="180" stroke="url(#primaryGrad)" stroke-width="2" class="radar" opacity="0.7"/>
  </g>

  <!-- Dynamic Aesthetic Floating Badges / Pills (Layered behind main text banner) -->
  <g class="float1" opacity="0.85">
    <rect x="830" y="45" width="160" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" filter="url(#shadow)"/>
    <circle cx="848" cy="62" r="5" fill="#38bdf8"/>
    <text x="862" y="67" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">COLLABORATIVE CF</text>
  </g>

  <g class="float2" opacity="0.85">
    <rect x="990" y="85" width="170" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" filter="url(#shadow)"/>
    <circle cx="1008" cy="102" r="5" fill="#c084fc"/>
    <text x="1022" y="107" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">TWO-TOWER RETRIEVAL</text>
  </g>

  <g class="float1" opacity="0.85">
    <rect x="850" y="270" width="150" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" filter="url(#shadow)"/>
    <circle cx="868" cy="287" r="5" fill="#818cf8"/>
    <text x="882" y="292" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">CTR RANKING ML</text>
  </g>

  <g class="float2" opacity="0.85">
    <rect x="1015" y="245" width="155" height="34" rx="17" fill="#1e293b" stroke="#34d399" stroke-width="1.2" filter="url(#shadow)"/>
    <circle cx="1033" cy="262" r="5" fill="#34d399"/>
    <text x="1047" y="267" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">PREFERENCE GRAPHS</text>
  </g>

  <!-- FOREGROUND BRANDING CONTENT (Guaranteed Unobscured) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 52)">
      <rect width="260" height="28" rx="14" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="14" cy="14" r="4" fill="#38bdf8"/>
      <text x="26" y="18" fill="#38bdf8" font-size="11.5" font-weight="700" letter-spacing="1">CURATED INTELLIGENCE STACK</text>
    </g>

    <!-- Title -->
    <text x="0" y="132" font-size="44" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-0.5" filter="url(#shadow)">
      Awesome Recommendation Systems
    </text>
    <text x="0" y="184" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      &amp; Preference Profiling
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="228" font-size="15.5" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      State-of-the-art Personalization Engines, Collaborative Filtering, Neural Ranking &amp; Vector Discovery
    </text>

    <!-- Mini Feature Metrics / Tags -->
    <g transform="translate(0, 266)">
      <!-- Tag 1 -->
      <g>
        <rect width="145" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" fill="#cbd5e1" font-size="12" font-weight="600">⚡ Real-Time Latency</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(155, 0)">
        <rect width="150" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" fill="#cbd5e1" font-size="12" font-weight="600">🎯 Neural Deep Ranking</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(315, 0)">
        <rect width="165" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" fill="#cbd5e1" font-size="12" font-weight="600">📦 Open Source &amp; SaaS</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(490, 0)">
        <rect width="150" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" fill="#cbd5e1" font-size="12" font-weight="600">🔒 Zero-Party Privacy</text>
      </g>
    </g>
  </g>
</svg>
